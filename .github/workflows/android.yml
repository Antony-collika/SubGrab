name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up fixed debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -e
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          test -s "$HOME/.android/debug.keystore"

      - name: Set up Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Unit tests
        run: ./gradlew test

      - name: Assemble debug APK
        run: ./gradlew assembleArm64Debug

      - name: Verify arm64 APK output
        run: |
          set -e
          apk=app/build/outputs/apk/arm64/debug/app-arm64-debug.apk
          ls -lh "$apk"
          test -f "$apk"
          test "$(unzip -l "$apk" | grep -c 'lib/arm64-v8a/libpython3.13.so')" -eq 1

      - name: Upload arm64 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubGrab-arm64-debug
          path: app/build/outputs/apk/arm64/debug/app-arm64-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ./gradlew assembleArm64Release
          mkdir -p release-assets
          cp app/build/outputs/apk/arm64/release/app-arm64-release-unsigned.apk "release-assets/SubGrab-${GITHUB_REF_NAME}-arm64-unsigned.apk"
          ls -lh release-assets

      - name: Upload release APK artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: SubGrab-${{ github.ref_name }}-release-apk
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "SubGrab $GITHUB_REF_NAME" \
            --generate-notes
