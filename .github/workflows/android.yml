name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/.secrets/subgrab-release.jks
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -e
          mkdir -p "$(dirname "$RELEASE_KEYSTORE_PATH")"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_PATH"
          chmod 600 "$RELEASE_KEYSTORE_PATH"
          test -s "$RELEASE_KEYSTORE_PATH"

      - name: Set up Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Unit tests
        run: ./gradlew test

      - name: Compile Android UI tests
        run: ./gradlew :app:compileArm64DebugAndroidTestKotlin :app:compileArm64DebugAndroidTestJavaWithJavac

      - name: Build release APK
        run: |
          set -e
          ./gradlew assembleArm64Release -PversionCode="$GITHUB_RUN_NUMBER" -PversionName="1.0.$GITHUB_RUN_NUMBER"
          mkdir -p release-assets
          # Git branch names may contain '/', which must not become a path
          # separator when the APK is copied into the artifact directory.
          safe_ref_name="${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/arm64/release/app-arm64-release.apk "release-assets/SubGrab-${safe_ref_name}-arm64.apk"
          ls -lh release-assets

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubGrab-release-apk
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "SubGrab $GITHUB_REF_NAME" \
            --generate-notes

  instrumentation:
    # Use the standard x64 runner because the Android emulator package is not published for the ARM64 Linux host image.
    # The Google APIs x86_64 system image provides ARM64 native-bridge support for ARM64 APKs.
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Run instrumentation tests on ARM64 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: ./gradlew :app:connectedArm64DebugAndroidTest --stacktrace
