name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests
        run: ./gradlew test
      - name: Assemble debug APK
        run: ./gradlew assembleDebug
      - name: Verify ABI APK outputs
        run: |
          set -e
          ls -lh app/build/outputs/apk/*/debug/*-debug.apk
          test -f app/build/outputs/apk/arm64/debug/app-arm64-debug.apk
          test -f app/build/outputs/apk/armv7/debug/app-armv7-debug.apk
          for apk in app/build/outputs/apk/*/debug/*-debug.apk; do
            size=$(stat -c%s "$apk")
            echo "$apk: $size bytes"
            test "$(unzip -l "$apk" | grep -c 'assets/yt-dlp$')" -eq 1
          done
